version: '3.8'

services:
  db:
    image: postgres:16
    container_name: sci_events_db
    restart: always
    environment:
      POSTGRES_USER: sci_admin
      POSTGRES_PASSWORD: sci_password_123
      POSTGRES_DB: sci_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: sci_events_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: sci_admin@sci-events.com
      PGADMIN_DEFAULT_PASSWORD: admin_123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: